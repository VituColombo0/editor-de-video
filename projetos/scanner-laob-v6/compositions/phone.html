  <script>
    (function () {
      const T = THREE;
      const W = 1080, H = 1920;
      const canvas = document.querySelector("#ph-cv");
      const renderer = new T.WebGLRenderer({ canvas, alpha: true, antialias: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(W, H, false);
      const scene = new T.Scene();
      const camera = new T.PerspectiveCamera(30, W / H, 0.05, 60);
      camera.position.set(0, 0.92, 5.9); camera.lookAt(0, 0.92, 0);
      let seed = 4242;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const parts = [];
      function part(geo, x, y, z, sx, sy, sz, rz) {
        const m = new T.Matrix4();
        const q = new T.Quaternion().setFromEuler(new T.Euler(0, 0, rz || 0));
        m.compose(new T.Vector3(x, y, z), q, new T.Vector3(sx, sy, sz));
        const g = geo.clone(); g.applyMatrix4(m); parts.push(g);
      }
      const cap = (r, l) => new T.CapsuleGeometry(r, l, 8, 18);
      const sph = (r) => new T.SphereGeometry(r, 24, 18);
      part(sph(0.105), 0, 1.63, 0, 1, 1.18, 1.05);           // cabeça
      part(cap(0.05, 0.06), 0, 1.47, 0, 1, 1, 1);            // pescoço
      part(cap(0.165, 0.36), 0, 1.17, 0, 1.18, 1, 0.68);     // tronco
      part(sph(0.17), 0, 0.9, 0, 1.08, 0.72, 0.72);          // quadril
      [-1, 1].forEach((s) => {
        part(sph(0.075), s * 0.205, 1.38, 0, 1, 0.85, 0.9);       // ombro
        part(cap(0.052, 0.25), s * 0.245, 1.19, 0, 1, 1, 1, s * 0.1);  // braço
        part(cap(0.044, 0.23), s * 0.275, 0.91, 0.01, 1, 1, 1, s * 0.05); // antebraço
        part(sph(0.048), s * 0.288, 0.74, 0.015, 0.8, 1.25, 0.6);     // mão
        part(cap(0.082, 0.34), s * 0.095, 0.6, 0, 1, 1, 1, -s * 0.03); // coxa
        part(cap(0.058, 0.34), s * 0.105, 0.2, 0, 1, 1, 1);          // perna
        part(sph(0.05), s * 0.105, 0.03, 0.06, 0.9, 0.5, 2.0);       // pé
      });

      // amostragem de pontos na superfície (proporcional à área)
      const tris = [];
      let totalA = 0;
      const va = new T.Vector3(), vb = new T.Vector3(), vc = new T.Vector3(), tmp = new T.Vector3();
      parts.forEach((g) => {
        const ng = g.index ? g.toNonIndexed() : g;
        const p = ng.attributes.position;
        for (let i = 0; i < p.count; i += 3) {
          va.fromBufferAttribute(p, i); vb.fromBufferAttribute(p, i + 1); vc.fromBufferAttribute(p, i + 2);
          const a = tmp.subVectors(vb, va).cross(new T.Vector3().subVectors(vc, va)).length() / 2;
          if (a <= 0) continue;
          totalA += a; tris.push([va.clone(), vb.clone(), vc.clone(), totalA]);
        }
      });

      const N = 7000;
      const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
      const c1 = new T.Color(0x2f6bff), c2 = new T.Color(0x7ff0ff), c = new T.Color();
      for (let i = 0; i < N; i++) {
        const r = rnd() * totalA; let lo = 0, hi = tris.length - 1;
        while (lo < hi) { const mid = (lo + hi) >> 1; if (tris[mid][3] < r) lo = mid + 1; else hi = mid; }
        const [A, B, C] = tris[lo]; let u = rnd(), v = rnd(); if (u + v > 1) { u = 1 - u; v = 1 - v; }
        pos[i * 3] = A.x + (B.x - A.x) * u + (C.x - A.x) * v; pos[i * 3 + 1] = A.y + (B.y - A.y) * u + (C.y - A.y) * v; pos[i * 3 + 2] = A.z + (B.z - A.z) * u + (C.z - A.z) * v;
        c.copy(c1).lerp(c2, rnd() * 0.6); col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
      }
      const g = new T.BufferGeometry();
      g.setAttribute("position", new T.BufferAttribute(pos, 3)); g.setAttribute("color", new T.BufferAttribute(col, 3));
      const mat = new T.PointsMaterial({ size: 0.016, vertexColors: true, transparent: true, blending: T.AdditiveBlending, depthWrite: false });
      const body = new T.Group(); body.add(new T.Points(g, mat)); scene.add(body);
      const ring = new T.Mesh(new T.TorusGeometry(0.42, 0.006, 8, 96), new T.MeshBasicMaterial({ color: 0x9ff4ff, transparent: true, opacity: 0.9 }));
      ring.rotation.x = Math.PI / 2; scene.add(ring);
      const st = { t: 0, drag: 0 };
      function render() {
        const t = st.t;
        // gira rápido na chegada, desacelera dentro do celular; o dedo soma rotação
        const spin = t < 2.3 ? t * 2.2 : 2.3 * 2.2 + (t - 2.3) * 0.35;
        body.rotation.y = spin + st.drag;
        ring.position.y = 0.05 + 1.75 * (0.5 - 0.5 * Math.cos(t * 1.7));
        ring.material.opacity = t < 3.0 ? 0.9 : 0.5;
        renderer.render(scene, camera);
      }
      const tl = gsap.timeline({ paused: true });
      // local 0 = 32.4s — cobertura de baixo para cima
      tl.fromTo("#ph-wrap", { y: 1920, filter: "blur(24px)" }, { y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 0.0);
      tl.fromTo(st, { t: 0 }, { t: 9.2, duration: 9.2, ease: "none", onUpdate: render }, 0);
      // títulos
      tl.fromTo("#ph-h1a", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 0.66);
      tl.fromTo("#ph-h1b", { opacity: 0, scale: 1.5, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, 2.1);
      tl.to("#ph-h1", { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.18, ease: "power3.in" }, 3.12);
      tl.fromTo("#ph-h2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.28, ease: "expo.out" }, 3.3);
      tl.to("#ph-h2", { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.18, ease: "power3.in" }, 4.85);
      tl.fromTo("#ph-h3", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.28, ease: "expo.out" }, 5.05);
      tl.to("#ph-h3", { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.18, ease: "power3.in" }, 6.95);
      tl.fromTo("#ph-h4", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.28, ease: "expo.out" }, 7.17);
      // o modelo voa para o celular
      tl.fromTo("#ph-phone", { y: 1300, rotation: 8 }, { y: 0, rotation: 0, duration: 0.85, ease: "expo.out" }, 1.25);
      tl.fromTo("#ph-cvw", { scale: 1, y: 0 }, { scale: 0.34, y: -205, duration: 0.95, ease: "power3.inOut" }, 1.2);
      tl.fromTo(["#ph-status", "#ph-island", "#ph-head"], { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.06 }, 1.9);
      tl.fromTo("#ph-viewer", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 2.0);
      tl.fromTo("#ph-notif", { y: -160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 2.4);
      tl.to("#ph-notif", { y: -160, opacity: 0, duration: 0.3, ease: "power3.in" }, 3.6);
      // dedo gira o modelo
      tl.fromTo("#ph-finger", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "expo.out" }, 3.35);
      tl.fromTo("#ph-finger", { x: 0 }, { keyframes: [{ x: -110, duration: 0.5, ease: "power2.inOut" }, { x: 120, duration: 0.7, ease: "power2.inOut" }, { x: 20, duration: 0.4, ease: "power2.out" }] }, 3.6);
      tl.fromTo(st, { drag: 0 }, { keyframes: [{ drag: -1.6, duration: 0.5, ease: "power2.inOut" }, { drag: 2.0, duration: 0.7, ease: "power2.inOut" }, { drag: 0.6, duration: 0.4, ease: "power2.out" }] }, 3.6);
      tl.to("#ph-finger", { opacity: 0, scale: 0.7, duration: 0.2 }, 5.3);
      // medidor de gordura
      tl.fromTo("#ph-card", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.4)" }, 5.05);
      tl.fromTo("#ph-arc", { strokeDasharray: "0 100" }, { strokeDasharray: "32.25 100", duration: 1.1, ease: "power3.out" }, 5.3);
      tl.fromTo("#ph-needle", { rotation: -90, svgOrigin: "95 105" }, { rotation: -90 + 180 * 12.9 / 40, svgOrigin: "95 105", duration: 1.1, ease: "power3.out" }, 5.3);
      const g2 = { v: 0 }; const ne = document.querySelector("#ph-num");
      const fmt = () => { ne.textContent = g2.v.toFixed(1).replace(".", ","); };
      tl.fromTo(g2, { v: 0 }, { v: 12.9, duration: 1.1, ease: "power3.out", onUpdate: fmt }, 5.3);
      tl.to("#ph-card", { keyframes: [{ scale: 1.05, duration: 0.07 }, { scale: 1, duration: 0.3, ease: "power3.out" }] }, 6.4);
      // detalhes da medição
      [["#ph-r1", 7.2], ["#ph-r2", 7.42], ["#ph-r3", 7.64]].forEach(([s, t]) => tl.fromTo(s, { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t));
      tl.fromTo("#ph-finger", { x: 20, y: 0 }, { x: 0, y: 531, duration: 0.01 }, 7.9);
      tl.fromTo("#ph-finger", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.2 }, 7.92);
      tl.fromTo("#ph-ripple", { scale: 1, opacity: 0.9 }, { scale: 2.6, opacity: 0, duration: 0.45, ease: "power2.out" }, 8.1);
      tl.fromTo("#ph-hi", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 8.1);
      tl.to("#ph-finger", { opacity: 0, duration: 0.2 }, 8.45);
      // saída: mergulho em direção à tela
      tl.to("#ph-wrap", { scale: 1.35, opacity: 0, filter: "blur(16px)", duration: 0.4, ease: "power3.in" }, 8.75);
      fmt(); render();
      window.__timelines["phone"] = tl;
    })();
