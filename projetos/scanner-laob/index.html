<!doctype html>
<html
  lang="pt-BR"
  data-resolution="portrait"
  data-composition-variables='[{"id":"hook","type":"string","label":"Frase fixa do topo","default":"E se um scan mostrasse do que o seu corpo é feito?"},{"id":"accent","type":"color","label":"Cor de destaque","default":"#2f6bff"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --accent: #2f6bff;
        --scan: #36e0ff;
        --ink: #0b1020;
        --font-display: "Montserrat", sans-serif;
        --font-ui: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #02030f; }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-ui); overflow: hidden; }

      /* Ambiente: parede iluminada de azul, como na referência */
      #bg {
        position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(ellipse 900px 760px at 540px 520px, #2a45ff 0%, #1426d8 30%, #0a1488 55%, #040840 75%, #02030f 100%);
      }
      #desk {
        position: absolute; left: 0; top: 1300px; width: 1080px; height: 620px; z-index: 0;
        background: linear-gradient(180deg, #0c1250 0%, #070a2a 40%, #03040f 100%);
      }
      #desk-glow {
        position: absolute; left: 90px; top: 1300px; width: 900px; height: 360px; z-index: 0;
        background: radial-gradient(ellipse 450px 160px at 450px 40px, rgba(90,120,255,0.35), rgba(90,120,255,0) 100%);
      }

      /* Notebook */
      #bezel {
        position: absolute; left: 36px; top: 612px; width: 1008px; height: 656px; z-index: 1;
        border-radius: 30px 30px 8px 8px;
        background: linear-gradient(180deg, #1a1b22 0%, #0b0b10 100%);
        box-shadow: 0 0 0 2px #2b2d3a inset, 0 40px 120px rgba(20,40,255,0.45);
      }
      #screen-off { position: absolute; left: 60px; top: 640px; width: 960px; height: 600px; z-index: 1; background: #05060d; border-radius: 6px; }
      #glass {
        position: absolute; left: 60px; top: 640px; width: 960px; height: 600px; z-index: 5; border-radius: 6px; pointer-events: none;
        background: linear-gradient(118deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.02) 28%, rgba(255,255,255,0) 45%);
      }
      #hinge {
        position: absolute; left: 20px; top: 1266px; width: 1040px; height: 16px; z-index: 1;
        border-radius: 3px 3px 10px 10px; background: linear-gradient(180deg, #3a3c48 0%, #15161c 100%);
      }
      #deck {
        position: absolute; left: -40px; top: 1282px; width: 1160px; height: 300px; z-index: 1;
        clip-path: polygon(5% 0, 95% 0, 100% 100%, 0 100%);
        background:
          repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 62px, rgba(0,0,0,0.55) 62px 68px),
          repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 44px, rgba(0,0,0,0.6) 44px 52px),
          linear-gradient(180deg, #1c1e2a 0%, #101118 60%, #08080c 100%);
        opacity: 0.95;
      }
      #deck-light {
        position: absolute; left: -40px; top: 1282px; width: 1160px; height: 300px; z-index: 1;
        clip-path: polygon(5% 0, 95% 0, 100% 100%, 0 100%);
        background: radial-gradient(ellipse 520px 180px at 580px 0px, rgba(80,110,255,0.35), rgba(80,110,255,0) 100%);
      }

      /* Frase-gancho fixa no topo (estilo da referência) */
      #hook-wrap { position: absolute; left: 0; top: 300px; width: 1080px; z-index: 6; display: flex; justify-content: center; }
      #hook {
        max-width: 860px; text-align: center; background: #fff; color: #0b0b0f;
        font-family: var(--font-display); font-weight: 700; font-size: 50px; line-height: 1.18;
        padding: 20px 34px 22px; border-radius: 16px; box-shadow: 0 18px 50px rgba(0,0,30,0.35);
      }

      .scene-host { z-index: 2; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="34.5" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <div id="desk"></div>
      <div id="desk-glow"></div>
      <div id="bezel"></div>
      <div id="screen-off"></div>
      <div id="hinge"></div>
      <div id="deck"></div>
      <div id="deck-light"></div>

      <div id="s1" class="scene-host" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s2" class="scene-host" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="4" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s3" class="scene-host" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="8" data-duration="2.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s4" class="scene-host" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="10.2" data-duration="3.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s5" class="scene-host" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="14" data-duration="2.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s6" class="scene-host" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="16.4" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s7" class="scene-host" data-composition-id="s7" data-composition-src="compositions/s7.html" data-start="19.6" data-duration="4.9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s8" class="scene-host" data-composition-id="s8" data-composition-src="compositions/s8.html" data-start="24.5" data-duration="5.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s9" class="scene-host" data-composition-id="s9" data-composition-src="compositions/s9.html" data-start="29.8" data-duration="4.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="glass"></div>
      <div id="hook-wrap"><div id="hook" data-var-text="hook">E se um scan mostrasse do que o seu corpo é feito?</div></div>

      <!-- Narração (Kokoro pt-BR) -->
      <audio id="vo" class="clip" src="assets/audio/narracao.wav" data-start="0" data-duration="34.5" data-track-index="10" data-volume="1"></audio>
      <!-- Trilha (catálogo HeyGen) -->
      <audio id="bgm" class="clip" src="assets/audio/trilha.wav" data-start="2.5" data-duration="32" data-track-index="40" data-volume="0.16" data-fade-in="0.4" data-fade-out="1.2"></audio>
      <!-- Efeitos sonoros -->
      <audio id="fx-whoosh1" class="clip" src="assets/audio/whoosh-short.mp3" data-start="3.95" data-track-index="12" data-volume="0.35"></audio>
      <audio id="fx-pop1" class="clip" src="assets/audio/pop.mp3" data-start="5.3" data-track-index="13" data-volume="0.3"></audio>
      <audio id="fx-glitch" class="clip" src="assets/audio/glitch-1.mp3" data-start="6.55" data-duration="0.6" data-track-index="14" data-volume="0.22"></audio>
      <audio id="fx-reveal" class="clip" src="assets/audio/whoosh-cinematic.mp3" data-start="7.85" data-duration="1.8" data-track-index="15" data-volume="0.35" data-fade-out="0.5"></audio>
      <audio id="fx-whoosh2" class="clip" src="assets/audio/whoosh.mp3" data-start="10.15" data-track-index="16" data-volume="0.3"></audio>
      <audio id="fx-pop2" class="clip" src="assets/audio/pop.mp3" data-start="10.75" data-track-index="17" data-volume="0.22"></audio>
      <audio id="fx-pop3" class="clip" src="assets/audio/pop.mp3" data-start="11.05" data-track-index="18" data-volume="0.18"></audio>
      <audio id="fx-pop4" class="clip" src="assets/audio/pop.mp3" data-start="11.35" data-track-index="19" data-volume="0.22"></audio>
      <audio id="fx-sparkle" class="clip" src="assets/audio/sparkle.mp3" data-start="14.05" data-track-index="20" data-volume="0.28"></audio>
      <audio id="fx-whoosh3" class="clip" src="assets/audio/whoosh-short.mp3" data-start="16.35" data-track-index="21" data-volume="0.3"></audio>
      <audio id="fx-pop5" class="clip" src="assets/audio/pop.mp3" data-start="18.65" data-track-index="22" data-volume="0.28"></audio>
      <audio id="fx-whoosh4" class="clip" src="assets/audio/whoosh.mp3" data-start="19.55" data-track-index="23" data-volume="0.28"></audio>
      <audio id="fx-key1" class="clip" src="assets/audio/key-press.mp3" data-start="19.95" data-track-index="24" data-volume="0.3"></audio>
      <audio id="fx-key2" class="clip" src="assets/audio/key-press.mp3" data-start="21.05" data-track-index="25" data-volume="0.25"></audio>
      <audio id="fx-key3" class="clip" src="assets/audio/key-press.mp3" data-start="22.25" data-track-index="26" data-volume="0.3"></audio>
      <audio id="fx-key4" class="clip" src="assets/audio/key-press.mp3" data-start="23.15" data-track-index="27" data-volume="0.25"></audio>
      <audio id="fx-riser" class="clip" src="assets/audio/riser.mp3" data-start="22.9" data-duration="3.45" data-track-index="28" data-volume="0.18"></audio>
      <audio id="fx-impact" class="clip" src="assets/audio/impact-bass-1.mp3" data-start="26.3" data-track-index="29" data-volume="0.45"></audio>
      <audio id="fx-end" class="clip" src="assets/audio/whoosh-cinematic.mp3" data-start="29.7" data-duration="2" data-track-index="30" data-volume="0.3" data-fade-out="0.6"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Leve "respiração" da luz da tela sobre o teclado, ligada às trocas de mundo (escuro → claro)
      tl.fromTo("#deck-light", { opacity: 0.6 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 8.0);
      tl.fromTo("#desk-glow", { opacity: 0.7 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 8.0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
